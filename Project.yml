name: Lenara
options:
  bundleIdPrefix: com.lenara
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

packages:
  LlamaCpp:
    path: Packages/LlamaCpp

settings:
  base:
    ASSETCATALOG_COMPILER_APPICON_NAME: LenaraAppIcon
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "12"
    INFOPLIST_FILE: Lenara/Resources/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.lenara.app
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_IPAD: false
    UIStatusBarHidden: false
    UISupportedInterfaceOrientations:
      - UIInterfaceOrientationPortrait
    CFBundleDisplayName: Lenara
    UILaunchScreen:
      UIColorName: Background
    LSMinimumSystemVersion: "17.0"

targets:
  Lenara:
    type: application
    platform: iOS
    sources:
      - path: Lenara
        excludes:
          - "**/*.md"
      - path: Shared/WidgetSharedStore.swift
      - path: Shared/ReminderCaptureActivity.swift
      - path: Shared/CaptureAssets.xcassets
    dependencies:
      - target: LenaraWidgets
        embed: true
      - package: LlamaCpp
        product: llama
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lenara.app
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) LENARA_APP"
        ASSETCATALOG_COMPILER_APPICON_NAME: LenaraAppIcon
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_IPAD: false
        UIStatusBarHidden: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleDisplayName: Lenara
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "17.0"
        CODE_SIGN_ENTITLEMENTS: Lenara/Lenara.entitlements
  LenaraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/UnitTests
    dependencies:
      - target: Lenara
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lenara.app.tests
        GENERATE_INFOPLIST_FILE: YES
  LenaraUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UITests
    dependencies:
      - target: Lenara
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lenara.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Lenara
  LenaraWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared/WidgetSharedStore.swift
      - path: Shared/ReminderCaptureActivity.swift
      - path: Shared/CaptureAssets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lenara.app.widgets
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widgets/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: LenaraWidgets
        CODE_SIGN_ENTITLEMENTS: Widgets/LenaraWidgets.entitlements

schemes:
  Lenara:
    build:
      targets:
        Lenara: all
    test:
      targets:
        - LenaraTests

  LenaraUIRegression:
    build:
      targets:
        Lenara: all
    test:
      targets:
        - LenaraUITests
